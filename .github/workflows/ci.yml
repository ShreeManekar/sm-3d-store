name: CI / Deploy to Render

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit tests (Jest)
        run: npm test

      - name: Run end‑to‑end tests (Cypress)
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: http://localhost:5173
          wait-on-timeout: 60

      - name: Build production bundle
        run: npm run build

      - name: Archive build artefacts
        run: zip -r dist.zip ./dist ./backend/server.js

      - name: Upload artefact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: render-build
          path: dist.zip

  deploy-to-render:
    needs: build-test-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Download artefact
        uses: actions/download-artifact@v4
        with:
          name: render-build
          path: .

      - name: Install Render CLI
        run: |
          curl -L https://github.com/renderhq/render-cli/releases/download/v1.15.0/render-linux-amd64 -o render
          chmod +x render
          sudo mv render /usr/local/bin/

      - name: Authenticate with Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: render login --api-key ${{ secrets.RENDER_API_KEY }}

      - name: Deploy front‑end service
        env:
          FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          PYTHON_BACKEND_URL: ${{ secrets.PYTHON_BACKEND_URL }}
        run: |
          render deploy \
            --service-id $FRONTEND_SERVICE_ID \
            --tarball dist.zip \
            --clear-cache
          render service update $FRONTEND_SERVICE_ID --env PYTHON_BACKEND_URL=$PYTHON_BACKEND_URL

      - name: Show service URL
        env:
          FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
        run: render services list | grep $FRONTEND_SERVICE_ID
